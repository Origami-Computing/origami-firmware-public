name: Firmware security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    name: Security and firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Security and architecture regressions
        run: |
          python3 tools/check_tracked_secrets.py
          python3 tools/check_architecture_dependencies.py
          python3 tools/test_architecture_dependencies.py
          python3 tools/test_security_boundaries.py
          python3 tools/test_bounded_http.py
          python3 tools/test_tls_anchor_policy.py
          python3 tools/test_tls_finished.py
          python3 tools/test_shipping.py
          python3 tools/test_shipping_power.py
          python3 tools/test_registration_priority.py
          python3 tools/test_clock_sync_start.py
          python3 tools/test_typewriter.py c++
          python3 tools/test_ota_download_policy.py
          python3 tools/test_ota_download_resume.py
          python3 tools/test_ota_versions.py
          python3 tools/test_mp3_metadata.py
          python3 tools/test_camera_shutter.py
          python3 tools/test_media_gallery.py
          python3 tools/test_photo_library.py
          python3 tools/test_video_library.py
          python3 tools/test_camera_session.py
          python3 tools/test_network_stack.py
          python3 tools/test_camera_video_teardown.py
          python3 tools/test_video_recording.py
          python3 tools/test_playback_start_admission.py
          python3 tools/test_lua_security.py
          python3 -m unittest discover -s tests/ota -v
      - name: Build production firmware
        run: |
          python3 -m venv "$RUNNER_TEMP/pio"
          "$RUNNER_TEMP/pio/bin/pip" install platformio==6.2.0
          "$RUNNER_TEMP/pio/bin/pio" run -e esp32-s3-menu-n16r8-production
          python3 tools/check_sdk_review.py --map .pio/build/esp32-s3-menu-n16r8-production/firmware.map
          python3 tools/test_sd_write_compat.py
          python3 tools/test_ota_boot_health.py
      - name: Analytics durability and Public default regressions
        env:
          ARDUINOJSON_SRC: .pio/libdeps/esp32-s3-menu-n16r8-production/ArduinoJson/src
        run: |
          python3 tools/test_usage_events.py
          python3 tools/test_usage_receipt.py
          python3 tools/test_telemetry_queue.py
          python3 tools/test_telemetry_journal.py
          python3 tools/test_telemetry_drain.py
          python3 tools/test_playback_start_admission.py
          python3 tools/test_agent_latency.py
          python3 tools/test_navigation_presentation.py
          python3 tools/test_ota_public_default.py
