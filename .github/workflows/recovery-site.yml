name: Deploy USB recovery site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/recovery-site.yml]
permissions:
  contents: read
concurrency:
  group: recovery-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Preserved recovery snapshot, also retained by recovery-site-2026-11-17.
      # This keeps the tested USB installer bytes unchanged without a live branch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 806c26dacc8e36f3e2c950e7acaaf7c0de450c39
          path: site
          persist-credentials: false
      - name: Verify recovery logic
        working-directory: site/source
        run: node --test core.test.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
