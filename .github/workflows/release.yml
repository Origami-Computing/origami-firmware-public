name: Build firmware draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New private candidate tag, e.g. v1.0.0-public-review.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-firmware-review
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    environment: release-review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      REVIEW_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check source and review tag
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          match = re.fullmatch(r'(v\d+\.\d+\.\d+)-public-review\.\d+', os.environ['REVIEW_TAG'])
          version = re.search(r'OTA_FIRMWARE_VERSION=.*?(v\d+\.\d+\.\d+)', pathlib.Path('platformio.ini').read_text()).group(1)
          if not match or match[1] != version:
              raise SystemExit('Use a versioned public-review tag')
          PY
          python3 tools/check_release_approval.py --digest > /tmp/source-digest.txt
          python3 tools/check_tracked_secrets.py
          python3 tools/check_architecture_dependencies.py
          python3 tools/test_architecture_dependencies.py
      - name: Build kamiOS production-policy candidate
        run: |
          python3 -m venv "$RUNNER_TEMP/pio-venv"
          "$RUNNER_TEMP/pio-venv/bin/pip" install platformio==6.2.0
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct)"
          "$RUNNER_TEMP/pio-venv/bin/pio" run -e esp32-s3-menu-n16r8-release-review
          python3 tools/check_sdk_review.py --map .pio/build/esp32-s3-menu-n16r8-release-review/firmware.map
          python3 tools/test_ota_boot_health.py
      - name: Collect application only
        run: |
          mkdir dist
          cp .pio/build/esp32-s3-menu-n16r8-release-review/firmware.bin dist/firmware.bin
          python3 - <<'PY'
          import hashlib, os, pathlib, json
          p = pathlib.Path('dist/firmware.bin')
          pathlib.Path('dist/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  firmware.bin\n')
          digest = pathlib.Path('/tmp/source-digest.txt').read_text().strip()
          version = os.environ['REVIEW_TAG'].split('-public-review.')[0]
          pathlib.Path('dist/REVIEW.json').write_text(json.dumps(dict(schema=1, version=version, source_commit=os.environ['GITHUB_SHA'], source_digest=digest, firmware_sha256=hashlib.sha256(p.read_bytes()).hexdigest()), indent=2)+'\n')
          pathlib.Path('dist/REVIEW.txt').write_text('kamiOS 1.0 private qualification candidate from ' + os.environ['GITHUB_SHA'] + '\nTracked source digest: ' + digest + '\nSigned production-policy image; not approved for public distribution. No OTA channel is changed by this draft build.\n')
          PY
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
      - name: Package source and full retained notices for review
        run: |
          python3 tools/package_source_review.py \
            --environment esp32-s3-menu-n16r8-release-review \
            --framework "$HOME/.platformio/packages/framework-arduinoespressif32" \
            --output dist/source-review.tar.gz
          python3 - <<'PYCODE'
          import hashlib, pathlib
          root = pathlib.Path('.')
          notices = [root/'LICENSE', root/'THIRD_PARTY_NOTICES.md']
          notices += sorted(p for p in (root/'third_party/licenses').rglob('*') if p.is_file())
          notices += sorted(p for p in (root/'lib').rglob('*') if p.is_file() and (p.name.lower().startswith(('license', 'copying', 'notice')) or p.name == 'COPYRIGHT'))
          pathlib.Path('dist/NOTICES-REVIEW.txt').write_text('Component notices for the reviewed ESP32-S3 candidate; see docs/sdk-review.md for scope.\n\n' + '\n\n'.join(str(p) + '\n' + p.read_text() for p in notices))
          paths = sorted(p for p in pathlib.Path('dist').iterdir() if p.is_file() and p.name != 'SHA256SUMS.txt')
          pathlib.Path('dist/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in paths))
          PYCODE
      - name: Sign candidate manifest without deploying
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile, shutil
          from pathlib import Path
          with tempfile.TemporaryDirectory() as d:
              key=Path(d)/'signing.pem'
              key.write_text(os.environ.pop('OTA_SIGNING_KEY')); key.chmod(0o600)
              subprocess.run(['python3','tools/ota/publish.py','--firmware','dist/firmware.bin','--channel','public','--version',os.environ['REVIEW_TAG'].split('-public-review.')[0],'--signing-key',str(key),'--output',str(Path(d)/'manifest'),'--prepare-only'],check=True)
              shutil.copyfile(Path(d)/'manifest/latest.json','dist/latest.json')
              # Old clients require a Production manifest. Prepare an internal
              # signed bridge for the same public bytes; do not deploy it here.
              import importlib.util, json
              spec=importlib.util.spec_from_file_location('publisher','tools/ota/publish.py')
              publisher=importlib.util.module_from_spec(spec);spec.loader.exec_module(publisher)
              payload=publisher.verify_manifest(json.loads(Path('dist/latest.json').read_text()))
              payload['channel']='production'
              payload['path']=payload['path'].replace('/releases/public/','/releases/production/',1)
              Path('bridge').mkdir()
              Path('bridge/legacy-bridge.json').write_text(json.dumps(publisher.sign_manifest(payload,key),separators=(',',':'))+'\n')
          import hashlib
          paths=sorted(p for p in Path('dist').iterdir() if p.name!='SHA256SUMS.txt')
          Path('dist/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in paths))
          PY
      - name: Create draft release only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$REVIEW_TAG" \
            --target "$GITHUB_SHA" --draft --latest=false \
            --title "kamiOS 1.0 — qualification $REVIEW_TAG" \
            --notes-file dist/REVIEW.txt \
            dist/*
      - name: Retain signed legacy bridge for private migration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-bridge-${{ inputs.tag }}
          path: bridge/legacy-bridge.json
          retention-days: 30
