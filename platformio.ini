; PlatformIO Project Configuration File
; Production firmware: menu only (octal PSRAM and N4R2 quad PSRAM variants).

[platformio]
default_envs = esp32-s3-menu-n16r8-production

[env:esp32-s3-devkitc-1]
; Tested N16R8 dependency set; see docs/build_reproducibility.md.
platform = espressif32@6.12.0
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  platformio/tool-esptoolpy@2.40900.250804
board = esp32-s3-devkitc-1
framework = arduino
; Pinned public CA source; builds never download or silently refresh trust.
board_build.embed_files = certs/mozilla.bundle
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.sdkconfig = sdkconfig.defaults
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; NOTE: TFT_BL / TFT_BACKLIGHT_ON are intentionally NOT defined. The LCD backlight
; (GPIO16) is owned by hal::display, which soft-starts it at bringup (rampBacklight)
; to bound backlight-FET inrush; letting TFT_eSPI drive TFT_BL would slam it HIGH in
; init() and re-introduce the +3V3 sag that times out shared-bus I2C (263).
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	
	-D USER_SETUP_LOADED
	-D ST7789_DRIVER
	-D TFT_RGB_ORDER=TFT_BGR
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=280
	-D TFT_CS=10
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_MISO=13
	-D TFT_DC=46
	-D TFT_RST=-1
	-D SD_CS=18
	-D ORIGAMI_DISPLAY_DIMMING
	-D ORIGAMI_INSTRUMENT_FONT
	-D LOAD_GLCD
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D LOAD_GFXFF
	-D SMOOTH_FONT
	-D SPI_FREQUENCY=80000000
	-D SUPPORT_TRANSACTIONS
	-D USE_HSPI_PORT


	-D BOARD_HAS_PSRAM

	-mfix-esp32-psram-cache-issue
	-I include
lib_deps = 
	SPI
	Wire
	SD
	FS
	adafruit/Adafruit TLV320 I2S@1.0.0
	adafruit/Adafruit BusIO@1.17.4
	stm32duino/STM32duino LSM6DSL@2.0.0
	espressif/esp32-camera@2.0.4
	bodmer/JPEGDecoder@2.0.0

[env:esp32-s3-menu]
extends = env:esp32-s3-devkitc-1
; Quad flash + octal PSRAM (ESP32-S3-WROOM R8 modules). Wrong mode corrupts SPIRAM heap/malloc.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions_ota.csv
monitor_filters = esp32_exception_decoder
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -I vendor/wpa3-sae/src
  -I vendor/wpa3-sae/src/utils
  -I vendor/wpa3-sae/include
  -D MENU_APP
  ; Arduino 2.0.17 TLS cleanup must leave socket=-1, never fd 0 (an SD file).
  -Wl,--wrap=_Z15stop_ssl_socketP17sslclient_contextPKcS2_S2_
  -Wl,--wrap=_Z16start_ssl_clientP17sslclient_contextRK9IPAddressjPKciS5_bS5_S5_S5_S5_bPS5_
  ; Agent pause cancels only its own TLS handshake, through normal SDK cleanup.
  -Wl,--wrap=mbedtls_net_send
  -Wl,--wrap=mbedtls_net_recv
  -Wl,--wrap=mbedtls_ssl_handshake
  ; Preserve fatal Agent TLS I/O codes before WiFiClientSecure destroys its socket.
  -Wl,--wrap=mbedtls_ssl_read
  -Wl,--wrap=mbedtls_ssl_write
  ; Bound Arduino's dynamic WiFi TX pool during sustained uploads (internal RAM).
  -Wl,--wrap=esp_wifi_init
  ; Bound Arduino DNS waits and retain asynchronous callback storage after timeout.
  -Wl,--wrap=_ZN16WiFiGenericClass10hostByNameEPKcR9IPAddress
  ; CA bundle: build-once index, never freed, and cross-signed roots accepted (tls_trust.cpp).
  -Wl,--wrap=arduino_esp_crt_bundle_set
  -Wl,--wrap=arduino_esp_crt_bundle_detach
  -Wl,--wrap=arduino_esp_crt_bundle_attach
  ; Pinned SDK disables certificate dates; enforce them against the synced clock.
  -Wl,--wrap=mbedtls_x509_time_is_past
  -Wl,--wrap=mbedtls_x509_time_is_future
  ; Arduino's camera archive needs a smaller JPEG DMA ring on fragmented heaps.
  -Wl,--wrap=cam_config
  -Wl,--wrap=ll_cam_dma_sizes
  -DSPI_DRIVER_SELECT=2
  -DCORE_DEBUG_LEVEL=1
  -Os
  -DOTA_FIRMWARE_VERSION='"v1.0.7"'

  ; Lua widget runtime (Phase 0 spike). 32-bit int/float ABI is set in
  ; lib/lua/src/luaconf.h (LUA_32BITS) — a -D flag can't override that header.
  ; LUA_PROBE links the de-risk probe.
  -DLUA_PROBE
  -I lib/lua/src
build_src_filter =
  -<*>
  +<main_menu.cpp>
  +<nav_handler.cpp>
  +<services.cpp>
  +<services/*.cpp>
  +<apps/*.cpp>
  +<apps/agent/*.cpp>
  +<core/*.cpp>
  +<games/*.cpp>
  +<control/*.cpp>
  +<tooling/*.cpp>
  +<sfx/*.cpp>
  +<ui/*.cpp>
  +<scene/*.cpp>
  +<widgets/*.cpp>
  +<upload_queue.cpp>
  +<hal/*.cpp>
  +<hal/mbedtls_finished.c>
  +<hal/wpa3_sae_compat.c>
lib_deps =
  ${env:esp32-s3-devkitc-1.lib_deps}
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  bblanchon/ArduinoJson@7.4.3
  links2004/WebSockets@2.7.3
  ricmoo/QRCode@0.0.1
  h2zero/NimBLE-Arduino@2.5.1

; Rev-4 production target: ESP32-S3 N16R8 (16 MB quad flash + 8 MB octal
; PSRAM). Keep this distinct from the historical 4 MB menu target so the image
; header and PlatformIO size checks describe the assembled module correctly.

[env:esp32-s3-menu-n16r8]
extra_scripts =
  pre:scripts/sd_write_compat.py
extends = env:esp32-s3-menu
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.after_reset = watchdog_reset
board_build.flash_size = 16MB
board_build.partitions = partitions_ota_n16r8.csv
build_unflags =
  -D TFT_RST=-1
build_flags =
  -DORIGAMI_NATIVE_APPS
  -DCONFIG_ELF_LOADER_BUS_ADDRESS_MIRROR=1
  -DCONFIG_ELF_LOADER_LOAD_PSRAM=1
  -DCONFIG_ELF_LOADER_CACHE_OFFSET=1
  ${env:esp32-s3-menu.build_flags}
  ; Video configuration carried from the tested video-settings build.
  -DORIGAMI_SD_20MHZ_TRIAL=1
  -DORIGAMI_VIDEO_HD_CROP_TRIAL=1
  -DORIGAMI_SD_BATCH_WRITE_TRIAL=1
  ; Hardware reset is now routed, removing the failure mode that was previously
  ; misattributed to fast SPI. Inherit the base 80 MHz clock: a 240x280 RGB565
  ; frame takes ~13.4 ms at 80 MHz versus ~107.5 ms at 10 MHz. The latter spans
  ; multiple refresh periods and tears even when the transfer starts on TE.
  ; The proven GPIO waveform is SPI mode 0. This TFT fork otherwise silently
  ; defaults all ST7789 panels to mode 3, which rev-4's panel does not accept.
  -DTFT_SPI_MODE=SPI_MODE0
  ; Rev-4 rework: panel J5 pin 4 (~RESET) is bodged to ESP32-S3 GPIO45.
  ; GPIO45's populated 100k pulldown keeps reset asserted through MCU boot.
  -DTFT_RST=45
  ; Keep USB serial command injection available on rev-4 bring-up hardware.
  -DORIGAMI_DEV_SERIAL_INPUT
  ; Rev-4 has no 32 kHz crystal: time deep sleep from the steadier 17.5 MHz/256 RC.
  -DORIGAMI_RTC_SLOW_8MD256
  ; Temporary host SOC for the unreworked 1 mOhm/reversed-sense prototype.
  ; Raw BQ27220 telemetry remains available. Runtime override: battery mode gauge.
  -DFUEL_GAUGE_HOST_WORKAROUND=1
  -DKAMI_GAMES=1
  ; Lossless eye caches leave room for a longer live-audio outage backlog.
  -DAGENT_STREAM_BACKLOG_SECONDS=60

; Official OTA artifacts are built only through this environment. Ordinary
; local N16R8 builds remain custom and require explicit download confirmation.

[env:esp32-s3-menu-n16r8-production]
extends = env:esp32-s3-menu-n16r8
build_flags =
  ${env:esp32-s3-menu-n16r8.build_flags}
  -DORIGAMI_PRODUCTION_BUILD=1

; Unpublished production-policy integration candidate. Remains a custom build so
; the next official release (including the same version) can replace it via OTA.

[env:esp32-s3-menu-n16r8-release-review]
extends = env:esp32-s3-menu-n16r8-production
build_flags =
  ${env:esp32-s3-menu-n16r8-production.build_flags}
  -DOTA_BUILD_OFFICIAL=1
